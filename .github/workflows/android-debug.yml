      # --------------------------------------------------
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version


      # --------------------------------------------------
      # 10. Clean
      # --------------------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean --stacktrace


      # --------------------------------------------------
      # 11. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Hesabdar Personal APK"
          echo "======================================"

          gradle :app:assembleDebug --stacktrace


      # --------------------------------------------------
