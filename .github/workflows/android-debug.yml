name: Hesabdar Android Debug APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Hesabdar 2.0.0 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # پیدا کردن و extract کردن جدیدترین zip سورس در ریشه‌ی ریپو
      - name: Extract source zip
        run: |
          # جدیدترین فایل zip موجود در ریشه‌ی ریپو رو پیدا می‌کنه
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repo root."
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted
          echo "Extracted contents:"
          find extracted -maxdepth 2

          # پیدا کردن پوشه‌ای که settings.gradle.kts توش هست
          SETTINGS_PATH=$(find extracted -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle.kts not found inside the zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory resolved to: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/hesabdar-2.0.0-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.0-debug
          path: ${{ env.PROJECT_DIR }}/artifacts/hesabdar-2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
