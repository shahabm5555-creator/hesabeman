name: Hesabdar Android Debug APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Hesabdar 2.0.0 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean
        run: gradle clean --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/hesabdar-2.0.0-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.0-debug
          path: artifacts/hesabdar-2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
