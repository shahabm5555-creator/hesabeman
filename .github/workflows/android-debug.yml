name: Hesabdar Personal Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar Personal v1.0.0
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout Repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup JDK 17
      # ==================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. Setup Android SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 4. Install Android SDK
      # ==================================================
      - name: Install Android SDK packages
        run: |
          set -e

          echo "======================================"
          echo "Installing Android SDK"
          echo "======================================"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # 5. Find Source ZIP
      # ==================================================
      - name: Find Hesabdar source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Hesabdar source ZIP"
          echo "======================================"

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "Hesabdar_Personal_v1.0.0_Stable.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Exact ZIP not found. Searching for any ZIP..."

            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found."

            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort

            exit 1
          fi

          echo "Source ZIP:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 6. Extract Source
      # ==================================================
      - name: Extract Android source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting Android source"
          echo "======================================"

          rm -rf project

          mkdir -p project

          unzip -o "$SOURCE_ZIP" -d project

          echo ""
          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -300


      # ==================================================
      # 7. Locate Android Project
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project"
          echo "======================================"

          SETTINGS_FILE=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) was not found."

            echo ""
            echo "Extracted project structure:"
            find project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 8. Verify Android Project
      # ==================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying Android project"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project structure is valid."


      # ==================================================
      # 9. Setup Gradle 8.9
      # ==================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==================================================
      # 10. Configure local.properties
      # ==================================================
      - name: Configure Android SDK path
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "local.properties:"
          cat "$PROJECT_DIR/local.properties"


      # ==================================================
      # 11. Verify Gradle
      # ==================================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle --version


      # ==================================================
      # 12. Clean Project
      # ==================================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Cleaning project"
          echo "======================================"

          gradle clean --stacktrace


      # ==================================================
      # 13. Build Debug APK
      # ==================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Hesabdar Personal APK"
          echo "======================================"

          gradle :app:assembleDebug --stacktrace

          echo ""
          echo "Build completed."


      # ==================================================
      # 14. Find APK
      # ==================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK"
          echo "======================================"

          OUTPUT_DIR="$PROJECT_DIR/app/build/outputs"

          echo ""
          echo "APK files found:"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          APK_FILE=$(find "$OUTPUT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find "$OUTPUT_DIR" \
              -type f \
              -name "*.apk" \
              -print -quit)

          fi

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo ""
          echo "Generated APK:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 15. Rename APK
      # ==================================================
      - name: Prepare Hesabdar APK
        shell: bash
        run: |
          set -e

          FINAL_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          mkdir -p "$FINAL_DIR"

          FINAL_APK="$FINAL_DIR/hesabdar.apk"

          cp "$APK_FILE" "$FINAL_APK"

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Final APK was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Final APK"
          echo "======================================"

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # ==================================================
      # 16. Verify APK
      # ==================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying APK"
          echo "======================================"

          test -f "$FINAL_APK"

          FILE_SIZE=$(stat -c%s "$FINAL_APK")

          echo "APK size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK verification successful."


      # ==================================================
      # 17. Upload APK
      # ==================================================
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
