name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Source ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android source ZIP found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract Android Source
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -o "$SOURCE_ZIP" -d project
          find project -maxdepth 3 -type f | sort | head -300

      - name: Locate Android Project
        run: |
          set -e
          SETTINGS=$(find project -maxdepth 3 -type f -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) was not found inside the ZIP."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      # This source has no gradlew/gradlew.bat/gradle-wrapper.jar checked in, only
      # gradle/wrapper/gradle-wrapper.properties. So instead of relying on ./gradlew,
      # we install the exact Gradle version it points to and invoke `gradle` directly.
      - name: Read Required Gradle Version
        run: |
          set -e
          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip|-all\.zip)' "$PROPS")
          fi
          VERSION="${VERSION:-8.9}"
          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Gradle version: $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
