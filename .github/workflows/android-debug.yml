name: Hesabdar Personal Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar Personal v1.0.0
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing Android SDK packages"
          echo "======================================"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -name "sdkmanager" \
            -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
              -path "*/cmdline-tools/*" \
              -name "sdkmanager" \
              -type f 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 5. Find source ZIP
      # ============================================================
      - name: Find Hesabdar Source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Hesabdar source ZIP"
          echo "======================================"

          ZIP_FILE=""

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "Hesabdar_Personal_v1.0.0_Stable.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android source ZIP found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Source ZIP:"
          echo "$ZIP_FILE"

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. Extract source
      # ============================================================
      - name: Extract Android Source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting Android source"
          echo "======================================"

          rm -rf project
          mkdir -p project

          unzip -o "$SOURCE_ZIP" -d project

          echo ""
          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 7. Locate Android project
      # ============================================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project"
          echo "======================================"

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) was not found."
            echo ""
            echo "Repository structure:"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle settings:"
          echo "$SETTINGS"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. Check Gradle wrapper
      # ============================================================
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking Gradle wrapper"
          echo "======================================"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
          fi


      # ============================================================
      # 9. Detect Gradle version
      # ============================================================
      - name: Detect Gradle Version
        shell: bash
        run: |
          set -e

          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          VERSION=""

          if [ -f "$PROPS" ]; then
            VERSION=$(grep -oP \
              'gradle-\K[0-9.]+(?=-bin\.zip|-all\.zip)' \
              "$PROPS" \
              | head -n 1 || true)
          fi

          VERSION="${VERSION:-8.9}"

          echo "Gradle version: $VERSION"

          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"


      # ============================================================
      # 10. Install Gradle
      # ============================================================
      - name: Install Gradle
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing Gradle $GRADLE_VERSION"
          echo "======================================"

          curl -fsSL \
            -o gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "$HOME/gradle-dist"
          mkdir -p "$HOME/gradle-dist"

          unzip -q gradle.zip -d "$HOME/gradle-dist"

          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 11. Verify Gradle
      # ============================================================
      - name: Verify Gradle
        run: |
          gradle --version


      # ============================================================
      # 12. local.properties
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"


      # ============================================================
      # 13. Clean
      # ============================================================
      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --stacktrace


      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Hesabdar APK"
          echo "======================================"

          gradle :app:assembleDebug --stacktrace


      # ============================================================
      # 15. Find APK
      # ============================================================
      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK output directory:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_SOURCE=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 16. Rename APK
      # ============================================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/final-apk"

          cp "$APK_SOURCE" \
            "$PROJECT_DIR/final-apk/hesabdar.apk"

          echo "======================================"
          echo "Final APK"
          echo "======================================"

          ls -lh "$PROJECT_DIR/final-apk/hesabdar.apk"


      # ============================================================
      # 17. Verify APK
      # ============================================================
      - name: Verify Final APK
        shell: bash
        run: |
          set -e

          test -f \
            "$PROJECT_DIR/final-apk/hesabdar.apk"

          SIZE=$(stat -c%s \
            "$PROJECT_DIR/final-apk/hesabdar.apk")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK file looks too small."
            exit 1
          fi

          echo "APK verification successful."


      # ============================================================
      # 18. Upload APK Artifact
      # ============================================================
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-v1.0.0-debug-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/final-apk/hesabdar.apk
          if-no-files-found: error
          retention-days: 30
