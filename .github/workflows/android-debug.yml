name: Hesabdar 2.0.1 Android Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.1
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت Repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. نصب Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. نصب Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. نصب Android SDK مورد نیاز
      # ==========================================
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 5. پیدا کردن ZIP
      # ==========================================
      - name: Find Hesabdar ZIP
        run: |
          set -e

          ZIP="Hesabdar_android_source_v2.0.1.zip"

          echo "Searching for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: Source ZIP was not found."
            echo ""
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

      # ==========================================
      # 6. استخراج سورس
      # ==========================================
      - name: Extract Hesabdar Source
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o \
            "Hesabdar_android_source_v2.0.1.zip" \
            -d project

          echo ""
          echo "Source extracted successfully."

          echo ""
          echo "Project files:"
          find project -maxdepth 4 -type f | sort | head -500

      # ==========================================
      # 7. پیدا کردن ریشه واقعی پروژه
      # ==========================================
      - name: Locate Android Project
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: settings.gradle(.kts) was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # ==========================================
      # 8. بررسی ساختار پروژه
      # ==========================================
      - name: Verify Android Project
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          echo "Checking:"
          echo "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts: OK"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle: OK"
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "build.gradle.kts: OK"
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle: OK"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app build.gradle file not found."
            exit 1
          fi

          echo ""
          echo "Android project structure is valid."

      # ==========================================
      # 9. نصب Gradle 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # 10. بررسی Gradle
      # ==========================================
      - name: Check Gradle
        run: |
          gradle --version

      # ==========================================
      # 11. Clean
      # ==========================================
      - name: Clean Project
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          gradle clean \
            --stacktrace

      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build Hesabdar 2.0.1 Debug APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "Building Hesabdar 2.0.1"
          echo "Gradle: 8.9"
          echo "Java: 17"
          echo "Android SDK: 35"
          echo "=========================================="
          echo ""

          gradle :app:assembleDebug \
            --stacktrace

      # ==========================================
      # 13. بررسی APK
      # ==========================================
      - name: Verify APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available build outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          ls -lh "$APK"

      # ==========================================
      # 14. آماده کردن APK
      # ==========================================
      - name: Prepare APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          rm -rf output
          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "output/hesabdar-2.0.1-debug.apk"

          echo ""
          echo "APK ready:"
          ls -lh output/hesabdar-2.0.1-debug.apk

      # ==========================================
      # 15. آپلود APK
      # ==========================================
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.1-debug
          path: output/hesabdar-2.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
