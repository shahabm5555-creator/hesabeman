name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.1.3 Debug APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Setup Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

