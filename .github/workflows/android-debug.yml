            echo "ERROR: APK file is unexpectedly small."
            exit 1
          fi

          echo "APK verified successfully."
          echo "Size: $FILE_SIZE bytes"

          ls -lh "$FINAL_APK"


      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30
