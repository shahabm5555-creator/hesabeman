name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.0 Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. دریافت سورس
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. نصب SDK مورد نیاز
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. بررسی محل پروژه
      - name: Find Android Project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -300

      # 6. پیدا کردن Gradle Wrapper
      - name: Locate Gradle Wrapper
        run: |
          echo "Searching for gradlew..."

          find . -name "gradlew" -type f -print

      # 7. تعیین مسیر پروژه
      - name: Prepare Gradle
        run: |
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Gradle project found in repository root."

          elif [ -f "./hesabeman/gradlew" ]; then
            echo "PROJECT_DIR=./hesabeman" >> "$GITHUB_ENV"
            echo "Gradle project found in ./hesabeman."

          elif [ -f "./Hesabdar/gradlew" ]; then
            echo "PROJECT_DIR=./Hesabdar" >> "$GITHUB_ENV"
            echo "Gradle project found in ./Hesabdar."

          else
            echo "ERROR: gradlew was not found."
            echo "The Android project structure is incorrect."
            exit 1
          fi

      # 8. مجوز اجرای Gradle
      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      # 9. بررسی Gradle
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      # 10. پاک‌سازی
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --stacktrace

      # 11. ساخت APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info

      # 12. بررسی APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 13. تغییر نام APK
      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p artifacts

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            artifacts/hesabdar-2.0.0-debug.apk

      # 14. آپلود APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.0-debug
          path: ${{ env.PROJECT_DIR }}/artifacts/hesabdar-2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
