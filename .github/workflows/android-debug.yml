name: Build Hesabdar 2.0.2 Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.2
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------
      # Java 17
      # ------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------
      # Android SDK
      # ------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------
      # Android SDK packages
      # ------------------------------------------
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------
      # Find ZIP
      # ------------------------------------------
      - name: Find Hesabdar Source ZIP
        run: |
          set -e

          ZIP="Hesabdar_android_source_v2.0.2_fixed.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP file was not found."
            echo ""
            echo "ZIP files available in repository:"
            find . -type f -name "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

      # ------------------------------------------
      # Extract source
      # ------------------------------------------
      - name: Extract Hesabdar Source
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o \
            "Hesabdar_android_source_v2.0.2_fixed.zip" \
            -d project

          echo ""
          echo "Source extracted successfully."

      # ------------------------------------------
      # Locate Android project
      # ------------------------------------------
      - name: Locate Android Project
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo ""
            echo "Project files:"
            find project -maxdepth 5 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # ------------------------------------------
      # Verify Android project
      # ------------------------------------------
      - name: Verify Android Project
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          echo "Checking project:"
          echo "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts: OK"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle: OK"
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "build.gradle.kts: OK"
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle: OK"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts: OK"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "app/build.gradle: OK"
          else
            echo "ERROR: app build.gradle file not found."
            exit 1
          fi

          echo ""
          echo "Android project structure is valid."

      # ------------------------------------------
      # Gradle 8.9
      # ------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ------------------------------------------
      # Check Gradle
      # ------------------------------------------
      - name: Check Gradle
        run: |
          gradle --version

      # ------------------------------------------
      # Build Debug APK
      # ------------------------------------------
      - name: Build Debug APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo "Hesabdar 2.0.2 Debug Build"
          echo "======================================"
          echo "Java: 17"
          echo "Gradle: 8.9"
          echo "Android SDK: 35"
          echo "======================================"
          echo ""

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ------------------------------------------
      # Verify APK
      # ------------------------------------------
      - name: Verify APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available outputs:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo ""

          ls -lh "$APK"

      # ------------------------------------------
      # Rename APK
      # ------------------------------------------
      - name: Prepare APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          rm -rf output
          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "output/hesabdar-2.0.2-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh output/hesabdar-2.0.2-debug.apk

      # ------------------------------------------
      # Upload APK
      # ------------------------------------------
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.2-debug
          path: output/hesabdar-2.0.2-debug.apk
          if-no-files-found: error
          retention-days: 30
