name: Hesabdar Personal Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar Personal v1.0.0
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 4. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 5. Find Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Android project..."
          echo "======================================"

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) was not found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort


      # --------------------------------------------------
      # 6. Verify Gradle project
      # --------------------------------------------------
      - name: Verify Gradle project
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo "Gradle project verified."


      # --------------------------------------------------
      # 7. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # --------------------------------------------------
      # 8. Write local.properties
      # --------------------------------------------------
      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "local.properties:"
          cat "$PROJECT_DIR/local.properties"


      # --------------------------------------------------
      # 9. Check Gradle
      # --------------------------------------------------
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version


      # --------------------------------------------------
      # 10. Clean
      # --------------------------------------------------
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean --stacktrace


      # --------------------------------------------------
      # 11. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Building Hesabdar Personal APK"
          echo "======================================"

          gradle :app:assembleDebug --stacktrace


      # --------------------------------------------------
      # 12. Find generated APK
      # --------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK..."
          echo "======================================"

          echo ""
          echo "All APK files:"
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print -quit)
          fi

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          echo ""
          echo "Found APK:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 13. Rename APK to simple stable name
      # --------------------------------------------------
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          mkdir -p "$OUTPUT_DIR"

          FINAL_APK="$OUTPUT_DIR/hesabdar.apk"

          cp "$APK_FILE" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 14. Verify final APK
      # --------------------------------------------------
      - name: Verify final APK
        run: |
          set -e

          echo "Checking final APK..."

          test -f "$FINAL_APK"

          FILE_SIZE=$(stat -c%s "$FINAL_APK")

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: APK file is unexpectedly small."
            exit 1
          fi

          echo "APK verified successfully."
          echo "Size: $FILE_SIZE bytes"

          ls -lh "$FINAL_APK"


      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload Hesabdar APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30
