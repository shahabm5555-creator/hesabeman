name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.1.3
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Source ZIP
        run: |
          set -e
          ZIP="Hesabdar_android_source_v2_1_3_invoice_fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found source ZIP:"
          ls -lh "$ZIP"

      - name: Extract Source
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -o "Hesabdar_android_source_v2_1_3_invoice_fixed.zip" -d project

      - name: Locate Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Android Project
        run: |
          set -e

          test -d "$PROJECT_DIR/app"

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "Root Gradle file found."
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Root Gradle file found."
          else
            echo "ERROR: Root Gradle file not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "App Gradle file found."
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App Gradle file found."
          else
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Write Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle clean --stacktrace --no-daemon

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Verify APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f -print
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.1.3-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
