name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.0 Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت سورس
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. نصب SDK و Build Tools مورد نیاز
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. بررسی ساختار پروژه
      - name: Check Android Project
        run: |
          echo "Checking project structure..."

          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          test -d app

          echo "Project structure OK."

      # 6. اجازه اجرای Gradle Wrapper
      - name: Make Gradle Wrapper executable
        run: |
          chmod +x gradlew

      # 7. بررسی نسخه Gradle
      - name: Check Gradle
        run: |
          ./gradlew --version

      # 8. پاک کردن Build قبلی
      - name: Clean
        run: |
          ./gradlew clean --stacktrace

      # 9. ساخت APK Debug
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info

      # 10. بررسی وجود APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 11. تغییر نام APK
      - name: Rename APK
        run: |
          mkdir -p artifacts

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            artifacts/hesabdar-2.0.0-debug.apk

          ls -lh artifacts/

      # 12. ذخیره APK به عنوان Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.0-debug
          path: artifacts/hesabdar-2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
