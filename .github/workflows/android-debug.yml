name: Hesabdar Android Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.2
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # Find EXACT source ZIP
      # ==========================================
      - name: Find Hesabdar Source
        run: |
          set -e

          ZIP="Hesabdar_android_source_v2.0.2_fixed2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"

            echo ""
            echo "ZIP files in repository:"
            find . -type f -name "*.zip" -print

            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "Using source:"
          ls -lh "$ZIP"

      # ==========================================
      # Extract
      # ==========================================
      - name: Extract Source
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o "$SOURCE_ZIP" -d project

          echo ""
          echo "Source extracted successfully."

      # ==========================================
      # Locate Android Project
      # ==========================================
      - name: Locate Android Project
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found."

            find project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

      # ==========================================
      # Verify project
      # ==========================================
      - name: Verify Project
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/build.gradle.kts" \
            || test -f "$PROJECT_DIR/build.gradle"

          test -d "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

          echo ""
          echo "Android project structure: OK"

      # ==========================================
      # Gradle 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # Check environment
      # ==========================================
      - name: Check Environment
        run: |
          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========== GRADLE =========="
          gradle --version

          echo ""
          echo "========== ANDROID SDK =========="
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|build-tools;35.0.0" \
            || true

      # ==========================================
      # Clean
      # ==========================================
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean \
            --stacktrace \
            --no-daemon

      # ==========================================
      # Check dependencies
      # ==========================================
      - name: Check Debug Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon

      # ==========================================
      # Duplicate classes check
      # ==========================================
      - name: Check Duplicate Classes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle :app:checkDebugDuplicateClasses \
            --stacktrace \
            --info \
            --no-daemon

      # ==========================================
      # Build
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      # ==========================================
      # Verify APK
      # ==========================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            find app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # ==========================================
      # Upload
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.2-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
