name: Hesabdar 2.0.1 Android Debug APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hesabdar 2.0.1
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. دریافت Repository
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------
      # 3. Android SDK
      # ----------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------
      # 4. نصب Android SDK
      # ----------------------------------------
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ----------------------------------------
      # 5. پیدا کردن ZIP نسخه 2.0.1
      # ----------------------------------------
      - name: Find Hesabdar ZIP
        run: |
          echo "Checking repository..."

          ls -la

          ZIP="Hesabdar_android_source_v2.0.1.zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR:"
            echo "$ZIP"
            echo "was not found."
            echo ""
            echo "ZIP files found:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

      # ----------------------------------------
      # 6. استخراج ZIP
      # ----------------------------------------
      - name: Extract Source
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o \
            "Hesabdar_android_source_v2.0.1.zip" \
            -d project

          echo ""
          echo "SOURCE EXTRACTED"
          echo ""

          find project -maxdepth 4 -type f | sort | head -500

      # ----------------------------------------
      # 7. پیدا کردن Gradle Wrapper
      # ----------------------------------------
      - name: Find Gradle Project
        run: |
          set -e

          echo "Searching for gradlew..."

          GRADLEW=$(find project \
            -type f \
            -name "gradlew" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew not found."
            echo ""
            echo "Files inside ZIP:"
            find project -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # ----------------------------------------
      # 8. بررسی ساختار Android
      # ----------------------------------------
      - name: Verify Project
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          echo "Checking:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew missing."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle found."
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts found."
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle found."
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "build.gradle.kts found."
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo ""
          echo "Android project structure OK."

      # ----------------------------------------
      # 9. فعال کردن Gradle Wrapper
      # ----------------------------------------
      - name: Prepare Gradle
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper is executable."

      # ----------------------------------------
      # 10. بررسی Gradle
      # ----------------------------------------
      - name: Check Gradle
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          ./gradlew --version

      # ----------------------------------------
      # 11. Clean
      # ----------------------------------------
      - name: Clean Project
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          ./gradlew clean --stacktrace

      # ----------------------------------------
      # 12. Build APK
      # ----------------------------------------
      - name: Build Debug APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo "Building Hesabdar 2.0.1..."

          ./gradlew :app:assembleDebug \
            --stacktrace

      # ----------------------------------------
      # 13. بررسی APK
      # ----------------------------------------
      - name: Verify APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available output files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "===================================="
          echo "BUILD SUCCESSFUL"
          echo "===================================="

          ls -lh "$APK"

      # ----------------------------------------
      # 14. آماده کردن APK
      # ----------------------------------------
      - name: Prepare APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "output/hesabdar-2.0.1-debug.apk"

          echo ""
          echo "APK:"
          ls -lh output/hesabdar-2.0.1-debug.apk

      # ----------------------------------------
      # 15. آپلود APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-2.0.1-debug
          path: output/hesabdar-2.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
